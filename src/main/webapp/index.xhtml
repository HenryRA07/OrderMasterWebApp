<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

<h:head>
    <title>Login - OrderMaster</title>
    <link rel="icon" href="images/logo_ShamanBlack.ico"/>
    <link rel="stylesheet" href="resources/css/styles.css"/>
</h:head>

<h:body>

    <div class="main-container">

        <div class="left-panel">
            <img style="padding-bottom: 45px; height: 300px" src="images/logo_ShamanBlack.png"/>

            <h1 class="brand-title">OrderMaster</h1>
            <h2 class="brand-subtitle">Asadero ShamanBlack</h2>

            <p class="brand-desc">
                Sistema integral de gestión de pedidos para tu restaurante.
                Controla operaciones, menú y ventas en un solo lugar.
            </p>
        </div>

        <div class="right-panel">
            <div class="login-wrapper">

                <div class="login-header">
                    <h2>Acceso al Sistema</h2>
                    <p>Ingrese sus credenciales para continuar</p>
                </div>

                <h:form id="loginForm">


                    <div class="custom-input-wrapper">
                       <span class="ui-float-label ui-input-icon-left">
                           <i class="pi pi-user" />
                           <p:inputText id="float-input" value="#{authenticationController.username}"/>
                           <p:outputLabel for="@previous" value="Username"/>
                       </span>
                    </div>

                    <div class="custom-input-wrapper">
                        <span class="ui-float-label ui-input-icon-left">
                            <i class="pi pi-lock" />
                            <p:password id="float-input2" value="#{authenticationController.password}" toggleMask="true"/>
                            <p:outputLabel for="@previous" value="Password" />
                        </span>
                    </div>

                    <p:messages id="messages"
                                showDetail="true"
                                showSummary="true"
                                closable="true"
                                redisplay="false"/>

                    <p:commandButton value="ENTRAR" action="#{authenticationController.login()}"
                                     styleClass="btn-login"
                                     update="@form messages"
                                     ajax="false"/>
                </h:form>

            </div>
        </div>

    </div>

</h:body>
</html>
