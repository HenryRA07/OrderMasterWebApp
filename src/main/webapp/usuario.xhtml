<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="primefaces">

<ui:composition template="/WEB-INF/templates/template.xhtml">
    <ui:define name="title">
        <title>Gestión de Usuarios - OrderMaster</title>
    </ui:define>

    <ui:define name="styles">
        <link rel="stylesheet" href="resources/css/template.css"/>
        <link rel="stylesheet" href="resources/css/stylesUsuario.css"/>
    </ui:define>

    <ui:define name="sidebar">
        <ui:include src="/WEB-INF/templates/sidebar.xhtml"/>
    </ui:define>

    <ui:define name="content">
        <p:growl id="msgs" showDetail="true"/>

        <div class="mobile-header">
            <i class="pi pi-bars" onclick="toggleSidebar()"></i>
            <span>OrderMaster</span>
        </div>

        <h1 class="section-title">Gestión de Usuarios</h1>

        <h:form id="formRegistro">
            <div class="card-custom">
                <p style="margin-top: 0; font-weight: bold; color: #4a5568;">
                    #{userHome.managed ? 'Editando Usuario: '.concat(userHome.user.name) : 'Registrar Nuevo Usuario'}
                </p>

                <div class="ui-g ui-fluid">
                    <div class="ui-g-12 ui-md-3">
                        <p:outputLabel value="Nombres" for="nom"/>
                        <p:inputText id="nom" placeholder="Nombres" value="#{userHome.user.name}" required="true"/>
                    </div>

                    <div class="ui-g-12 ui-md-3">
                        <p:outputLabel value="Apellidos" for="ape"/>
                        <p:inputText id="ape" placeholder="Apellidos"  required="true"/>
                    </div>

                    <div class="ui-g-12 ui-md-3">
                        <p:outputLabel value="Rol" for="rol"/>
                        <p:selectOneMenu id="rol" value="#{usuarioBean.rolSeleccionado}">
                            <f:selectItem itemLabel="Seleccione un rol" itemValue="#{null}" noSelectionOption="true" />
                            <f:selectItem itemLabel="Administrador" itemValue="admin" />
                            <f:selectItem itemLabel="Mesero" itemValue="mesero" />
                            <f:selectItem itemLabel="Cocinero" itemValue="cocinero" />
                            <f:selectItem itemLabel="Caja" itemValue="caja" />
                        </p:selectOneMenu>
                    </div>

                    <div class="ui-g-12 ui-md-3">
                        <p:outputLabel value="DNI" for="dni"/>
                        <p:inputText id="dni" placeholder="DNI" value="#{userHome.user.organization.identificationNumber}" required="true"/>
                    </div>

                    <div class="ui-g-12 ui-md-3">
                        <p:outputLabel value="Correo" for="mail"/>
                        <p:inputText id="mail" placeholder="correo@ejemplo.com" value="#{userHome.user.organization.email}" required="true"/>
                    </div>

                    <div class="ui-g-12 ui-md-3">
                        <p:outputLabel value="Password" for="pass" rendered="#{!userHome.managed}"/>
                        <p:password id="pass" value="#{userHome.user.password}" rendered="#{!userHome.managed}" toggleMask="true"/>
                    </div>

                </div>


                <div style="display: flex; gap: 15px; margin-top: 20px; align-items: flex-end;">
                    <p:commandButton value="Guardar Nuevo"
                                     actionListener="#{userHome.create()}"
                                     rendered="#{!userHome.managed}"
                                     update="@form :formTabla:tablaUsers :msgs"
                                     icon="pi pi-save"
                                     styleClass="btn-gold" />

                    <p:commandButton value="Actualizar Cambios"
                                     actionListener="#{userHome.update()}"
                                     rendered="#{userHome.managed}"
                                     update="@form :formTabla:tablaUsers :msgs"
                                     icon="pi pi-save"
                                     styleClass="btn-gold" />

                    <p:commandButton value="Limpiar/Nuevo"
                                     actionListener="#{userHome.reset()}"
                                     update="@form"
                                     process="@this"
                                     icon="pi pi-refresh"
                                     styleClass="btn-black" />
                </div>
            </div>
        </h:form>

        <h:form id="formTabla">
            <div class="card-custom">
                <p style="margin-top: 0; font-weight: bold; color: #4a5568;">Usuarios del Sistema</p>
                <div style="margin: 0 10px;">
                    <span style="color: #51575f;"> #{userList.users.size()} encontrados</span>
                </div>


                <p:dataTable id="tablaUsers" var="_user" value="#{userList.users}"
                             styleClass="ui-datatable-striped"
                             emptyMessage="No Existen usuarios"
                             paginator="true" rows="10" paginatorPosition="bottom">

                    <p:column headerText="ID" width="50">
                        <h:outputText value="#{_user.id}" />
                    </p:column>
                    <p:column headerText="Nombre Completo">
                        <h:outputText value="#{_user.name}" />
                    </p:column>
                    <p:column headerText="Rol">
                        <h:outputText value="#{_user.roles}" />
                    </p:column>

<!--                    <p:column>-->
<!--                        <p:commandButton id="_status"-->
<!--                                         icon="#{_user.activo ? 'pi pi-check-circle' : 'pi pi-times-circle'}"-->
<!--                                         styleClass="rounded-button #{_user.activo ? 'ui-button-success' : 'ui-button-danger'}"-->
<!--                                         title="#{_user.activo ? 'Desactivar usuario' : 'Activar usuario'}"-->
<!--                                         action="#{userList.toggleStatus(_user)}"-->
<!--                                         update="@this"-->
<!--                                         process="@this">-->
<!--                            <p:confirm header="Confirmación"-->
<!--                                       message="¿Estás seguro de cambiar el estado de este usuario?"-->
<!--                                       icon="pi pi-exclamation-triangle" />-->
<!--                        </p:commandButton>-->
<!--                    </p:column>-->

                </p:dataTable>
            </div>
        </h:form>
    </ui:define>

</ui:composition>
</html>
