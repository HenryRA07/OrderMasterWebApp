<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="primefaces">

<h:head>
    <ui:insert name="title">
        <title>OrderMaster - Sistema de Gestión</title>
    </ui:insert>
    <link rel="icon" href="images/logo_ShamanBlack.ico"/>
    <ui:insert name="styles">
        <link rel="stylesheet" href="resources/css/template.css"/>
    </ui:insert>
</h:head>

<h:body>
    <div class="app-container">
        <!-- Sidebar izquierdo -->
        <ui:insert name="sidebar">
            <!-- Sidebar por defecto si no se especifica -->
            <div class="sidebar">
                <div class="sidebar-header">
                    <i class="pi pi-fire sidebar-logo-icon"></i>
                    <span class="sidebar-logo">OrderMaster</span>
                    <span class="sidebar-subtitle">Asadero ShamanBlack</span>
                </div>
                <div class="sidebar-footer">
                    <p:commandLink action="index?faces-redirect=true" styleClass="nav-item nav-item-exit">
                        <i class="pi pi-arrow-right"></i> Salir
                    </p:commandLink>
                </div>
            </div>
        </ui:insert>

        <!-- Contenido principal -->
        <div class="main-content">
            <ui:insert name="content">
                <!-- Contenido por defecto si no se especifica -->
                <div class="default-content">
                    <h1>OrderMaster</h1>
                    <p>Sistema de gestión de pedidos</p>
                </div>
            </ui:insert>
        </div>
    </div>

    <!-- Scripts globales -->
    <ui:insert name="scripts">
        <!-- Scripts por defecto si se necesitan -->
    </ui:insert>
</h:body>
</html>
