<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="primefaces">

<ui:composition>
    <div class="sidebar">
        <!-- Header del sidebar -->
        <div class="sidebar-header">
            <i class="pi pi-fire sidebar-logo-icon"></i>
            <span class="sidebar-logo">OrderMaster</span>
            <span class="sidebar-subtitle">Asadero ShamanBlack</span>
        </div>

        <!-- Menú de navegación -->
        <div class="sidebar-menu">
            <ui:repeat value="#{navigationItems}" var="item">
                <ui:fragment>
                    <h:panelGroup rendered="#{item.commandLink}">
                        <p:commandLink action="#{item.action}" 
                                     styleClass="nav-item #{item.active ? 'active' : ''}"
                                     rendered="#{item.action != null}">
                            <i class="#{item.icon}"></i> #{item.label}
                        </p:commandLink>
                    </h:panelGroup>
                    <h:panelGroup rendered="#{!item.commandLink}">
                        <a href="#{item.url}" class="nav-item #{item.active ? 'active' : ''}">
                            <i class="#{item.icon}"></i> #{item.label}
                        </a>
                    </h:panelGroup>
                </ui:fragment>
            </ui:repeat>
        </div>

        <!-- Footer del sidebar -->
        <div class="sidebar-footer">
            <p:commandLink action="index.xhtml?faces-redirect=true" styleClass="nav-item nav-item-exit">
                <i class="pi pi-arrow-right"></i> Salir
            </p:commandLink>
        </div>
    </div>
</ui:composition>

</html>
