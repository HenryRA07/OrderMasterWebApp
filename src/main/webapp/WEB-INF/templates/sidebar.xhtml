<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="primefaces">

<ui:composition>
    <div class="sidebar">
        <!-- Header del sidebar -->
        <div class="sidebar-header">
            <i class="pi pi-fire sidebar-logo-icon"></i>
            <span class="sidebar-logo">OrderMaster</span>
            <span class="sidebar-subtitle">Asadero ShamanBlack</span>
        </div>

        <!-- Menú de navegación -->
        <div class="sidebar-menu">
            <ui:repeat value="#{navigationController.getNavigationItems()}" var="item">
                <a href="#{item.url}"
                   class="nav-item #{item.active ? 'active' : ''}">
                    <i class="#{item.icon}"></i> #{item.label}
                </a>
            </ui:repeat>
        </div>

        <!-- Footer del sidebar -->
        <div class="sidebar-footer">
            <p:button value="Salir"
                      outcome="/index.xhtml"
                      ajax="false"
                      styleClass="button-exit nav-item-exit">
            </p:button>
        </div>
    </div>
</ui:composition>

</html>
