<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<ui:composition template="/WEB-INF/templates/template.xhtml">
    <ui:define name="title">
        <title>Panel de Cocina - OrderMaster</title>
    </ui:define>
    
    <ui:define name="styles">
        <link rel="stylesheet" href="resources/css/template.css"/>
        <link rel="stylesheet" href="resources/css/stylesCocina.css"/>
    </ui:define>

    <ui:define name="sidebar">
        <ui:include src="/WEB-INF/templates/sidebar.xhtml">
            <ui:param name="navigationItems" value="#{
                [{
                    label: 'Pedidos Pendientes',
                    url: '#',
                    icon: 'pi pi-clock',
                    active: true
                }]
            }"/>
        </ui:include>
    </ui:define>

    <ui:define name="content">
        <h1 style="font-size: 1.8rem; font-weight: bold;">Pedidos Pendientes - Cocina</h1>

        <h:form id="formCocina">
            <div class="orders-container">
                <ui:repeat value="#{cocina.pedidosPendientes}" var="pedido">
                    <div class="order-card">
                        <div class="order-header">
                            <div class="order-info">
                                <div class="order-id">
                                    <strong style="font-size: 1.2rem; color: #2d3748;">ORD-#{pedido.id}</strong>
                                </div>
                                <div class="order-details">
                                    <div class="detail-row">
                                        <i class="pi pi-user" style="color: #718096; margin-right: 5px; font-size: 0.8rem;"></i>
                                        <small style="color: #4a5568;">Cliente: #{pedido.cliente.nombreCompleto}</small>
                                    </div>
                                    <h:panelGroup rendered="#{pedido.mesa != null}">
                                        <div class="detail-row">
                                            <i class="pi pi-table" style="color: #718096; margin-right: 5px; font-size: 0.8rem;"></i>
                                            <small style="color: #4a5568;">Mesa: #{pedido.mesa}</small>
                                        </div>
                                    </h:panelGroup>
                                    <div class="detail-row">
                                        <i class="pi pi-clock" style="color: #718096; margin-right: 5px; font-size: 0.8rem;"></i>
                                        <small style="color: #4a5568;">Fecha: #{pedido.fechaPedidoCreacion}</small>
                                    </div>
                                </div>
                            </div>
                            <span class="status-badge status-pending">#{pedido.estado}</span>
                        </div>
                        
                        <div class="order-body">
                            <div class="items-section">
                                <ui:repeat value="#{pedido.itemPedido}" var="item" varStatus="status">
                                    <div class="item-container">
                                        <div class="item-header">
                                            <span class="item-quantity">#{item.cantidad}x</span>
                                            <span class="item-name">#{item.item.producto.nombre}</span>
                                        </div>
                                        <h:panelGroup rendered="#{item.observacion != null and !item.observacion.trim().isEmpty() and item.observacion != '-'}">
                                            <div class="item-observation">
                                                <i class="pi pi-info-circle" style="color: #e53e3e; margin-right: 5px; font-size: 0.7rem;"></i>
                                                <span class="observation-text">Obs: #{item.observacion}</span>
                                            </div>
                                        </h:panelGroup>
                                        <h:panelGroup rendered="#{status.last != true}">
                                            <div class="item-divider"></div>
                                        </h:panelGroup>
                                    </div>
                                </ui:repeat>
                            </div>
                        </div>
                        
                        <div class="order-footer">
                            <p:commandButton value="Marcar como Listo" 
                                             icon="pi pi-check" 
                                             styleClass="btn-action-ready"
                                             action="#{cocina.marcarPedidoListo(pedido)}"
                                             update="formCocina"/>
                            <p:commandButton value="Ver Detalles" 
                                             icon="pi pi-eye" 
                                             styleClass="btn-details"/>
                        </div>
                    </div>
                </ui:repeat>
                
                <h:panelGroup rendered="#{empty cocina.pedidosPendientes}">
                    <div style="text-align: center; padding: 40px; color: #718096;">
                        <i class="pi pi-clock" style="font-size: 2rem; margin-bottom: 10px;"></i>
                        <p>No hay pedidos pendientes</p>
                    </div>
                </h:panelGroup>
            </div>
        </h:form>
    </ui:define>
</ui:composition>
</html>
