<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<h:head>
    <title>Panel de Cocina - OrderMaster</title>
    <link rel="icon" href="images/logo_ShamanBlack.ico"/>
    <link rel="stylesheet" href="resources/css/stylesCocina.css"/>
</h:head>

<h:body>
    <div class="sidebar">

        <div class="sidebar-logo">
            <i class="pi pi-fire"></i> OrderMaster
        </div>

        <div class="sidebar-menu">
            <a href="#" class="nav-item active">
                <i class="pi pi-clock"></i> Pedidos Pendientes
            </a>
        </div>

        <div class="sidebar-footer">
            <p:commandLink action="index.xhtml?faces-redirect=true" styleClass="nav-item">
                <i class="pi pi-sign-out"></i> Salir
            </p:commandLink>
        </div>
    </div>


    <div class="main-content">
        <h1 style="font-size: 1.8rem; font-weight: bold;">Pedidos Pendientes - Cocina</h1>

        <h:form id="formCocina">
            <div class="orders-container">
                <ui:repeat value="#{cocina.pedidosPendientes}" var="pedido">
                    <div class="order-card">
                        <div class="order-header">
                            <div>
                                <strong style="font-size: 1.1rem;">ORD-#{pedido.id}</strong><br/>
                                <small style="color: #718096;">Mesa: #{pedido.mesa}</small>
                                <br/>
                                <small style="color: #718096;">Cliente: #{pedido.cliente.nombreCompleto}</small>
                            </div>
                            <span class="status-badge status-pending">#{pedido.estado}</span>
                        </div>
                        <div class="order-body">
                            <ui:repeat value="#{pedido.itemPedido}" var="item">
                                <div class="item-row">
                                    <span style="font-weight: bold; color: #d4af37;">#{item.cantidad}x</span> #{item.item.producto.nombre}
                                    <h:panelGroup rendered="#{item.observacion != null and !item.observacion.trim().isEmpty()}">
                                        <div class="observation-box">Obs: #{item.observacion}</div>
                                    </h:panelGroup>
                                </div>
                            </ui:repeat>
                        </div>
                        <div class="order-footer">
                            <p:commandButton value="Marcar como Listo" 
                                             icon="pi pi-check" 
                                             styleClass="btn-action-ready"
                                             action="#{cocina.marcarPedidoListo(pedido)}"
                                             update="formCocina"/>
                            <p:commandButton value="Ver Detalles" 
                                             icon="pi pi-eye" 
                                             styleClass="btn-details"/>
                        </div>
                    </div>
                </ui:repeat>
                
                <h:panelGroup rendered="#{empty cocina.pedidosPendientes}">
                    <div style="text-align: center; padding: 40px; color: #718096;">
                        <i class="pi pi-clock" style="font-size: 2rem; margin-bottom: 10px;"></i>
                        <p>No hay pedidos pendientes</p>
                    </div>
                </h:panelGroup>
            </div>
        </h:form>
    </div>
</h:body>
</html>
